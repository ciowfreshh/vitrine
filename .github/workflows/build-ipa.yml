name: Build Spotify SYNA IPA from your own Spotify IPA

on:
  # Build once when the build workflow itself changes. Other source commits
  # do not start costly macOS runners; workflow_dispatch remains available.
  push:
    branches: [syna-spotify-v1]
    paths: [.github/workflows/build-ipa.yml]
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Direct link to a decrypted Spotify IPA (optional; default is 9.1.90)"
        required: false
        default: "https://github.com/codeboy2012/PwEevee/releases/download/v3.1.6.1/com.spotify.client_9.1.90_und3fined.ipa"
        type: string
      upload_method:
        description: "Where to put the result"
        default: artifacts
        type: choice
        options: [artifacts, filebin, both]

permissions:
  contents: read

# Avoid overlapping CI jobs when the workflow button is pressed repeatedly.
# One pending job remains; no running job is interrupted.
concurrency:
  group: spotify-syna-ipa-${{ github.ref }}
  cancel-in-progress: false

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  build:
    # Use the standard Intel pool: macos-latest targets Arm64 and can fail runner acquisition.
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v5

      - uses: levibostian/action-hide-sensitive-inputs@v1

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/checkout@v5
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Install tools
        run: |
          brew install make dpkg ldid
          python3 -m pip install --break-system-packages git+https://github.com/asdfzxcvbn/pyzule-rw.git
          # cyan is installed above with this same Python interpreter.
          python3 -m pip install --break-system-packages 'Pillow>=10'
          python3 -c 'from PIL import Image; print("cyan icon support ready:", Image.__version__)'

      - name: Download IPA
        env:
          IPA_URL: ${{ inputs.ipa_url || 'https://github.com/codeboy2012/PwEevee/releases/download/v3.1.6.1/com.spotify.client_9.1.90_und3fined.ipa' }}
        run: |
          mkdir -p ipa
          curl -fsSL "$IPA_URL" -o ipa/spotify.ipa
          case "$(file --mime-type -b ipa/spotify.ipa)" in application/zip|application/x-ios-app) ;; *) echo "::error::Not an IPA"; exit 1 ;; esac

      - name: Build preflight
        run: |
          python3 scripts/verify-syna-v1.py
          python3 -c 'from PIL import Image; print("Pillow OK:", Image.__version__)'

      - name: Run make release
        run: |
          mkdir -p out
          set -o pipefail
          make release 2>&1 | tee out/build-syna.log

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: Spotify_SYNA_build_log
          path: out/build-syna.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v5
        if: inputs.upload_method != 'filebin'
        with:
          name: Spotify_SYNA_V1
          path: out/*.ipa
          if-no-files-found: error

      - name: Upload to filebin.net
        if: inputs.upload_method != 'artifacts'
        run: |
          BIN="spotify-syna-${{ github.run_id }}"
          echo "### filebin.net download" >> "$GITHUB_STEP_SUMMARY"
          for f in out/*.ipa; do
            curl -fsS -X POST -H "Content-Type: application/octet-stream" --data-binary "@$f" "https://filebin.net/$BIN/$(basename "$f")" >/dev/null
            echo "- https://filebin.net/$BIN/$(basename "$f")" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "- _filebin deletes bins after a few days of inactivity, download promptly._" >> "$GITHUB_STEP_SUMMARY"
