# This path already exists on main, so GitHub exposes manual dispatch before this PR is merged.
# Choose vitrine-i18n-translation-v2; the reusable workflow executes that selected branch's code.
name: Build IPA from your own Spotify IPA
on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'HTTPS URL to your decrypted Spotify IPA'
        required: true
        type: string
      upload_method:
        description: 'Private workflow artifacts'
        default: artifacts
        type: choice
        options: [artifacts]
permissions:
  contents: read
jobs:
  vitrine-v2:
    uses: ./.github/workflows/vitrine-v2.yml
    with:
      ipa_url: ${{ inputs.ipa_url }}
