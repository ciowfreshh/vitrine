name: Spotify SYNA V1 source checks
on:
  push:
    branches: [syna-spotify-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check SYNA source, layers, script and icon PNG
        run: python3 scripts/verify-syna-v1.py
